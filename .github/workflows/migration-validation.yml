name: Migration validation

on:
  pull_request:
    branches:
      - jonoka/migration-v0.9-preview

permissions:
  contents: read

concurrency:
  group: migration-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies using the image build toolchain
        run: bun install --no-save

      - name: Typecheck
        run: bun run typecheck

      - name: Protocol tests
        run: bun run test:protocol

      - name: Plugin security tests
        run: bun run test:plugin-security

      - name: Build official plugin registry
        working-directory: plugins/canvas/registry
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Build
        run: bun run build

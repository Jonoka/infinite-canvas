name: Migration validation

on:
  pull_request:
    branches:
      - jonoka/migration-v0.9-preview

permissions:
  contents: read

concurrency:
  group: migration-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        # Upstream v0.9 pairs antd 6 with a Pro Components beta whose published
        # peer range still names antd 5; the committed lockfile is authoritative.
        run: npm ci --legacy-peer-deps

      - name: Install Rollup native binary workaround
        # npm/cli#4828 can omit platform optional dependencies from a lockfile
        # generated on another platform. Keep the workaround version tied to
        # the Rollup version already locked by Vite.
        run: npm install --no-save --ignore-scripts --legacy-peer-deps @rollup/rollup-linux-x64-gnu@4.62.2

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

name: Migration validation

on:
  pull_request:
    branches:
      - jonoka/migration-v0.9-preview

permissions:
  contents: read

concurrency:
  group: migration-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Regenerate npm lockfile remotely
        run: npm install --package-lock-only --legacy-peer-deps --ignore-scripts

      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: migration-web-package-lock
          path: web/package-lock.json
          if-no-files-found: error
          retention-days: 1

      - name: Require committed lockfile to be current
        run: git diff --exit-code -- package-lock.json

      - name: Typecheck
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build
